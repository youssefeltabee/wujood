name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_MaNCSboVWwrZ4crnocUbYi6F
  VERCEL_PROJECT_ID: prj_xDzpQfVIKNGHDDrcHJf2QCGbaaV8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - name: Push database schema (best-effort)
        id: db-push
        continue-on-error: true
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Report schema push result
        if: always()
        run: |
          case "${{ steps.db-push.outcome }}" in
            success) echo "Schema push succeeded" ;;
            failure|cancelled) echo "::error::Schema push ${{ steps.db-push.outcome }} — check Supabase connectivity." ;;
            *) echo "Schema push outcome: ${{ steps.db-push.outcome }}" ;;
          esac
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
